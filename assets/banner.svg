<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Layered water at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#122b3d"/>
      <stop offset="55%"  stop-color="#2b5f80"/>
      <stop offset="100%" stop-color="#3a7ca5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#dceff9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dceff9" stop-opacity="0"/>
