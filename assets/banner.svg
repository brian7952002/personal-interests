<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Layered water at dusk with a figure walking along the near bank">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#122b3d"/>
      <stop offset="55%"  stop-color="#2b5f80"/>
      <stop offset="100%" stop-color="#3a7ca5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#dceff9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dceff9" stop-opacity="0"/>
    </radialGradient>

    <style>
      /* Position: walk right, pause, walk back, pause. */
      .walker { animation: stroll 30s linear infinite; }
      @keyframes stroll {
        0%   { transform: translateX(90px);   }
        45%  { transform: translateX(1060px); }
        50%  { transform: translateX(1060px); }
        95%  { transform: translateX(90px);   }
        100% { transform: translateX(90px);   }
      }

      /* Facing: flip at each end of the walk. Origin is x=0, which is
         why the figure is drawn centred on zero. */
      .facing { animation: turn 30s steps(1, end) infinite; }
      @keyframes turn {
        0%, 47%   { transform: scaleX(1);  }
        48%, 100% { transform: scaleX(-1); }
      }

      /* Two leg frames cross-faded on a hard step = a 2-frame walk cycle. */
      .fa, .fb { animation: flick .44s steps(1, end) infinite; }
      .fb { animation-delay: -.22s; }
      @keyframes flick { 0% { opacity: 1; } 50%, 100% { opacity: 0; } }

      /* One-pixel bob, in sync with the stride. */
      .guy { animation: bob .44s steps(1, end) infinite; }
      @keyframes bob {
        0%   { transform: translateY(0); }
        50%, 100% { transform: translateY(-1.5px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .walker, .facing, .fa, .fb, .guy { animation: none; }
        .walker { transform: translateX(420px); }
        .fb { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>

  <g fill="#dceff9">
    <circle cx="140" cy="58"  r="1.8" opacity="0.7"/>
    <circle cx="255" cy="104" r="1.2" opacity="0.5"/>
    <circle cx="368" cy="44"  r="1.6" opacity="0.6"/>
    <circle cx="470" cy="92"  r="1.1" opacity="0.4"/>
    <circle cx="612" cy="52"  r="1.7" opacity="0.65"/>
    <circle cx="735" cy="112" r="1.2" opacity="0.45"/>
    <circle cx="1075" cy="62" r="1.5" opacity="0.55"/>
  </g>

  <circle cx="912" cy="98" r="120" fill="url(#glow)"/>
  <circle cx="912" cy="98" r="40"  fill="#e8f4fb"/>

  <path d="M0 180 C 200 155, 380 205, 600 180 S 1000 150, 1200 178 L1200 300 L0 300 Z"
        fill="#3a7ca5" opacity="0.40"/>
  <path d="M0 210 C 180 236, 360 186, 580 213 S 980 241, 1200 208 L1200 300 L0 300 Z"
        fill="#2d6485" opacity="0.60"/>
  <path d="M0 241 C 220 216, 420 263, 640 241 S 1020 213, 1200 243 L1200 300 L0 300 Z"
        fill="#21495f" opacity="0.80"/>
  <path d="M0 270 C 200 289, 420 253, 660 273 S 1030 293, 1200 268 L1200 300 L0 300 Z"
        fill="#16313f"/>

  <g transform="translate(0,288)">
    <g class="walker">
      <g class="facing">
        <g class="guy" fill="#a8cfe4" shape-rendering="crispEdges">
          <rect x="-3" y="-33" width="9"  height="6"/>
          <rect x="0"  y="-27" width="3"  height="3"/>
          <rect x="-6" y="-24" width="15" height="3"/>
          <rect x="-3" y="-21" width="9"  height="9"/>
          <g class="fa">
            <rect x="-3" y="-12" width="3" height="3"/>
            <rect x="3"  y="-12" width="3" height="3"/>
            <rect x="-6" y="-9"  width="3" height="9"/>
            <rect x="6"  y="-9"  width="3" height="9"/>
          </g>
          <g class="fb">
            <rect x="-3" y="-12" width="3" height="12"/>
            <rect x="3"  y="-12" width="3" height="12"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
