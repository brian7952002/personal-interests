    <circle cx="255" cy="104" r="1.2" opacity="0.5"/>
    <circle cx="368" cy="44"  r="1.6" opacity="0.6"/>
    <circle cx="470" cy="92"  r="1.1" opacity="0.4"/>
    <circle cx="612" cy="52"  r="1.7" opacity="0.65"/>
    <circle cx="735" cy="112" r="1.2" opacity="0.45"/>
    <circle cx="1075" cy="62" r="1.5" opacity="0.55"/>
